<style>
.wgm{--o:#E77717;--o2:#c9620c;--ink:#1d2330;--ink2:#313041;--mut:#5b6170;--sand:#f7f1e8;--line:#ece4d8;--r:14px;color:var(--ink);font-size:17px;line-height:1.7;overflow-x:clip}
.wgm *,.wgm *:before,.wgm *:after{box-sizing:border-box}
.wgm img{max-width:100%;height:auto;display:block}
.wgm h1,.wgm h2,.wgm h3{color:var(--ink);line-height:1.2;margin:0 0 .5em;font-weight:800;letter-spacing:-.01em;text-transform:none}
.wgm h1,.wgm h2,.wgm h3{text-wrap:balance}
.wgm h2{font-size:clamp(28px,3.4vw,42px)}
.wgm h3{font-size:20px}
.wgm p{margin:0 0 1em;color:var(--mut)}
.wgm a{text-decoration:none}
.wgm-wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.wgm-sec{padding:88px 0}
.wgm-sand{background:var(--sand)}
.wgm-eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--o);margin-bottom:12px}
.wgm-head{max-width:760px;margin:0 auto 48px;text-align:center}
.wgm-btn{display:inline-flex;align-items:center;gap:8px;padding:15px 28px;border-radius:999px;font-weight:700;font-size:16px;line-height:1;transition:transform .15s,background .15s,color .15s;border:2px solid transparent}
.wgm-btn:hover{transform:translateY(-2px)}
.wgm-btn-o{background:var(--o);color:#fff!important}
.wgm-btn-o:hover{background:var(--o2)}
.wgm-btn-w{border-color:#fff;color:#fff!important}
.wgm-btn-w:hover{background:#fff;color:var(--ink)!important}
.wgm-btn-d{border-color:var(--ink);color:var(--ink)!important}
.wgm-btn-d:hover{background:var(--ink);color:#fff!important}
/* hero */
.wgm-hero{position:relative;min-height:88vh;display:flex;align-items:center;color:#fff;overflow:hidden;background:#20242c}
.wgm-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wgm-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,18,26,.82) 0%,rgba(15,18,26,.55) 45%,rgba(15,18,26,.1) 100%)}
.wgm-hero .wgm-wrap{position:relative;z-index:1;width:100%;padding-top:80px;padding-bottom:80px}
.wgm-hero-in{max-width:640px}
.wgm-hero h1{color:#fff;font-size:clamp(38px,5.6vw,68px);margin-bottom:20px}
.wgm-hero h1 span{color:var(--o)}
.wgm-hero p{color:rgba(255,255,255,.88);font-size:clamp(17px,1.5vw,19px);margin-bottom:32px}
.wgm-hero .wgm-eyebrow{color:#ffb56b}
.wgm-ctas{display:flex;flex-wrap:wrap;gap:14px}
.wgm-trust{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:40px;padding:0;list-style:none}
.wgm-trust li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#fff}
.wgm-trust li:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--o);flex:none}
/* intro */
.wgm-split{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.wgm-split.rev>:first-child{order:2}
.wgm-media{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:0 24px 50px -24px rgba(29,35,48,.45)}
.wgm-media img{width:100%;aspect-ratio:4/3;object-fit:cover}
.wgm-badge{position:absolute;left:20px;bottom:20px;background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:14px;line-height:1.4;color:var(--mut)}
.wgm-badge b{display:block;font-size:22px;color:var(--ink)}
/* values */
.wgm-vals{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.wgm-val{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 26px}
.wgm-val svg{width:44px;height:44px;margin-bottom:16px;color:var(--o)}
.wgm-val h3{font-size:18px;letter-spacing:.02em}
.wgm-val p{font-size:15.5px;margin:0}
/* tours */
.wgm-tabs{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.wgm-tabs h3{font-size:26px;margin:0}
.wgm-tabs a{color:var(--o);font-weight:700}
.wgm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.wgm-card{display:flex;flex-direction:column;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;color:var(--ink)}
.wgm-card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(29,35,48,.4)}
.wgm-card-img{position:relative}
.wgm-card-img img{width:100%;aspect-ratio:58/45;object-fit:cover}
.wgm-tag{position:absolute;top:14px;left:14px;background:rgba(29,35,48,.85);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.wgm-card-b{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.wgm-card-b h3{font-size:19px;margin-bottom:8px}
.wgm-card-b p{font-size:15px;margin-bottom:16px}
.wgm-meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:14.5px;color:var(--mut)}
.wgm-meta b{color:var(--ink);font-size:19px}
.wgm-meta>span:last-child{white-space:nowrap}
.wgm-grid4 .wgm-meta{flex-wrap:wrap;gap:4px 10px}
.wgm-tours+.wgm-tours{margin-top:64px}
.wgm-grid4{grid-template-columns:repeat(4,1fr);gap:22px}
.wgm-grid4 .wgm-card-b{padding:18px 18px 20px}
.wgm-grid4 .wgm-card-b h3{font-size:18px}
.wgm-custom{display:grid;grid-template-columns:380px 1fr;margin-top:26px;background:var(--sand);border-radius:var(--r);overflow:hidden;color:var(--ink);align-items:center}
.wgm-custom img{width:100%;height:100%;object-fit:cover;min-height:240px}
.wgm-custom>div{padding:32px 40px}
.wgm-custom .wgm-tag{position:static;display:inline-block;margin-bottom:12px}
.wgm-custom h3{font-size:24px}
/* list */
.wgm-check{list-style:none;padding:0;margin:0 0 22px}
.wgm-check li{position:relative;padding-left:32px;margin-bottom:10px;color:var(--ink)}
.wgm-check li:before{content:'';position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:var(--o)}.wgm-check li:after{content:'';position:absolute;left:7px;top:10px;width:6px;height:10px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.wgm-note{background:#fff;border-left:4px solid var(--o);border-radius:8px;padding:16px 20px;margin:0 0 24px;color:var(--ink)}
/* features */
.wgm-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.wgm-box{background:#fff;border-radius:var(--r);padding:34px;border:1px solid var(--line)}
.wgm-box p:last-child{margin:0}
/* climate */
.wgm-weather{margin-top:22px;border-radius:12px;overflow:hidden}
/* faq */
.wgm-faq{max-width:860px;margin:0 auto}
.wgm-faq details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:0 22px}
.wgm-faq summary{cursor:pointer;list-style:none;padding:19px 34px 19px 0;font-weight:700;font-size:17px;position:relative;color:var(--ink)}
.wgm-faq summary::-webkit-details-marker{display:none}
.wgm-faq summary:after{content:'+';position:absolute;right:0;top:12px;font-size:26px;color:var(--o);font-weight:400}
.wgm-faq details[open] summary:after{content:'–'}
.wgm-faq details p{padding-bottom:18px;margin:0}
/* cta */
.wgm-cta{position:relative;background:var(--ink2);color:#fff;text-align:center;padding:96px 0;overflow:hidden}
.wgm-cta:before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;background:var(--o);opacity:.14;right:-160px;top:-220px}
.wgm-cta h2{color:#fff;position:relative}
.wgm-cta p{color:rgba(255,255,255,.8);max-width:620px;margin:0 auto 32px;position:relative}
.wgm-cta .wgm-ctas{justify-content:center;position:relative}
@media (max-width:1024px){.wgm-vals{grid-template-columns:repeat(2,1fr)}.wgm-grid,.wgm-grid4{grid-template-columns:repeat(2,1fr)}.wgm-custom{grid-template-columns:260px 1fr}.wgm-split{gap:40px}}
@media (max-width:767px){.wgm{font-size:16px}.wgm-sec{padding:60px 0}.wgm-hero{min-height:auto}.wgm-hero:after{background:linear-gradient(180deg,rgba(15,18,26,.55),rgba(15,18,26,.85))}.wgm-hero .wgm-wrap{padding-top:110px;padding-bottom:60px}.wgm-split,.wgm-cols{grid-template-columns:1fr}.wgm-split.rev>:first-child{order:0}.wgm-vals,.wgm-grid,.wgm-grid4,.wgm-custom{grid-template-columns:1fr}.wgm-custom>div{padding:24px}.wgm-custom img{min-height:0;aspect-ratio:58/45}.wgm-btn{width:100%;justify-content:center}.wgm-box{padding:26px}.wgm-head{margin-bottom:34px}}
</style>
